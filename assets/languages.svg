<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Top programming languages by repository bytes — live from GitHub">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="12" stroke="#1a2340" stroke-width="1"/>
  <text x="24" y="32" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" filter="url(#glow)">TOP LANGUAGES (REAL REPO CODE)</text>
  <text x="770" y="32" text-anchor="end" fill="#3a5070" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="8.5">aggregated from all public repos</text>
  
  <text x="24" y="60" fill="#e6edf3" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="bold">JavaScript</text>
  <rect x="150" y="48" width="540" height="14" rx="7" fill="#0b1224"/>
  <rect x="150" y="48" width="0" height="14" rx="7" fill="#f1e05a">
    <animate attributeName="width" from="0" to="540" dur="1.0s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="710" y="59" fill="#f1e05a" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="bold">60.3%</text>
  <text x="24" y="88" fill="#e6edf3" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="bold">TypeScript</text>
  <rect x="150" y="76" width="540" height="14" rx="7" fill="#0b1224"/>
  <rect x="150" y="76" width="0" height="14" rx="7" fill="#3178c6">
    <animate attributeName="width" from="0" to="184" dur="1.0s" begin="0.35s" fill="freeze"/>
  </rect>
  <text x="710" y="87" fill="#3178c6" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="bold">20.5%</text>
  <text x="24" y="116" fill="#e6edf3" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="bold">Python</text>
  <rect x="150" y="104" width="540" height="14" rx="7" fill="#0b1224"/>
  <rect x="150" y="104" width="0" height="14" rx="7" fill="#3572A5">
    <animate attributeName="width" from="0" to="101" dur="1.0s" begin="0.5s" fill="freeze"/>
  </rect>
  <text x="710" y="115" fill="#3572A5" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="bold">11.3%</text>
  <text x="24" y="144" fill="#e6edf3" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="bold">EJS</text>
  <rect x="150" y="132" width="540" height="14" rx="7" fill="#0b1224"/>
  <rect x="150" y="132" width="0" height="14" rx="7" fill="#a91e50">
    <animate attributeName="width" from="0" to="44" dur="1.0s" begin="0.6499999999999999s" fill="freeze"/>
  </rect>
  <text x="710" y="143" fill="#a91e50" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="bold">4.9%</text>
  <text x="24" y="172" fill="#e6edf3" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="bold">CSS</text>
  <rect x="150" y="160" width="540" height="14" rx="7" fill="#0b1224"/>
  <rect x="150" y="160" width="0" height="14" rx="7" fill="#563d7c">
    <animate attributeName="width" from="0" to="18" dur="1.0s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="710" y="171" fill="#563d7c" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="bold">2.0%</text>
</svg>