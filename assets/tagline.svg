<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" role="img" aria-label="Dynamic Role &amp; Mission Headline">
  <defs>
    <linearGradient id="stack-hairline"><stop stop-color="#247bff" stop-opacity=".7"/><stop offset=".5" stop-color="#567394" stop-opacity=".25"/><stop offset="1" stop-color="#ff354f" stop-opacity=".65"/></linearGradient>
    <pattern id="stack-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#99b1db" opacity=".13"/></pattern>
    <linearGradient id="barGradCyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background with Builder-Pass hairline border & dot matrix -->
  <rect x="1" y="1" width="1198" height="54" rx="14" fill="#070b16" stroke="url(#stack-hairline)" stroke-width="1.2"/>
  <rect x="2" y="2" width="1196" height="52" rx="13" fill="url(#stack-dots)" stroke="none"/>
  <rect x="1" y="1" width="1198" height="2.5" rx="1" fill="url(#barGradCyan)"/>

  <!-- Left Focus Chip -->
  <rect x="18" y="12" width="96" height="32" rx="8" fill="#0d182c" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.2"/>
  <circle cx="34" cy="28" r="4" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="32.5" fill="#22d3ee" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="900" letter-spacing="1.5">FOCUS</text>

  <!-- Cycling Role & Stack Headlines (No Terminal Prompt / No Cursor) -->
  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="800">
    <!-- Phrase 1: "Full-Stack Developer (AI + Web)" -->
    <text x="135" y="33" fill="url(#tagGrad)" filter="url(#textGlow)">
      Full-Stack Developer (AI + Web) · Building &amp; Shipping Scalable Systems
      <animate attributeName="opacity" values="1;1;0;0;0;0" dur="9s" repeatCount="indefinite" begin="0s"/>
    </text>

    <!-- Phrase 2: "Groq LLM · Gemini · YOLOv8 · FastAPI" -->
    <text x="135" y="33" fill="url(#tagGrad)" filter="url(#textGlow)">
      Groq LLM · Gemini API · YOLOv8 · FastAPI · React.js · Node.js
      <animate attributeName="opacity" values="0;0;0;1;1;0" dur="9s" repeatCount="indefinite" begin="0s"/>
    </text>

    <!-- Phrase 3: "Open to Internships & Full-Time Roles" -->
    <text x="135" y="33" fill="url(#tagGrad)" filter="url(#textGlow)">
      Open to Internships &amp; Full-Time SDE Opportunities · Vadodara / Remote
      <animate attributeName="opacity" values="0;0;0;0;0;1" dur="9s" repeatCount="indefinite" begin="0s"/>
    </text>
  </g>

  <!-- Right Availability Chip -->
  <rect x="1070" y="14" width="112" height="28" rx="7" fill="#0d182c" stroke="#1d2d48" stroke-width="1.2"/>
  <circle cx="1086" cy="28" r="3.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1132" y="32" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="800" fill="#34d399" letter-spacing="1">AVAILABLE</text>
</svg>
