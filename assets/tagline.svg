<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 56" width="1180" height="56" role="img" aria-label="Typing tagline: Full-Stack + AI Developer">
  <defs>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1180" height="56" fill="#070b14" rx="10" stroke="#162238" stroke-width="1"/>
  <text x="24" y="34" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="bold" filter="url(#textGlow)">$</text>
  <text x="44" y="34" fill="#64748b" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14">./intro.sh</text>

  <!-- Phrase 1: "Full-Stack Developer (AI + Web)" -->
  <text y="34" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14.5" font-weight="bold" fill="url(#tagGrad)" filter="url(#textGlow)">
    <tspan x="190">Full-Stack Developer (AI + Web) · Building &amp; Shipping Scalable Systems</tspan>
    <animate attributeName="opacity" values="1;1;0;0;0;0" dur="9s" repeatCount="indefinite" begin="0s"/>
  </text>

  <!-- Phrase 2: "Groq LLM · Gemini · YOLOv8 · FastAPI" -->
  <text y="34" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14.5" font-weight="bold" fill="url(#tagGrad)" filter="url(#textGlow)">
    <tspan x="190">Groq LLM · Gemini API · YOLOv8 · FastAPI · React.js · Node.js</tspan>
    <animate attributeName="opacity" values="0;0;0;1;1;0" dur="9s" repeatCount="indefinite" begin="0s"/>
  </text>

  <!-- Phrase 3: "Open to Internships & Full-Time Roles" -->
  <text y="34" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14.5" font-weight="bold" fill="url(#tagGrad)" filter="url(#textGlow)">
    <tspan x="190">Open to Internships &amp; Full-Time SDE Opportunities · Vadodara / Remote</tspan>
    <animate attributeName="opacity" values="0;0;0;0;0;1" dur="9s" repeatCount="indefinite" begin="0s"/>
  </text>

  <!-- Blinking cursor -->
  <rect y="20" width="8" height="17" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/>
    <animate attributeName="x" values="760;760;700;700;780;780" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
