<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Dhruvil Dattani - Animated Cyberpunk Neon Wave Footer">
  <title>Dhruvil Dattani - Cyber Wave Horizon Footer</title>
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070b14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#091022" stop-opacity="1"/>
    </linearGradient>

    <!-- Wave 1: Deep Aurora Violet / Magenta -->
    <linearGradient id="waveGradViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Wave 2: Cyber Emerald / Teal -->
    <linearGradient id="waveGradEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.40"/>
      <stop offset="75%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Wave 3: Electric Neon Cyan / Sky Blue -->
    <linearGradient id="waveGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Laser Crest Line Gradient -->
    <linearGradient id="laserCrest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="1.0"/>
      <stop offset="85%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Secondary Crest Gradient -->
    <linearGradient id="laserCrest2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="brandTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Pill Border Gradient -->
    <linearGradient id="pillBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Dot Matrix Pattern (from builder-pass.svg) -->
    <pattern id="footer-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#1e293b" opacity="0.6"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Canvas with Cyber Grid Dots -->
  <rect width="1200" height="140" fill="url(#bgGrad)"/>
  <rect width="1200" height="140" fill="url(#footer-dots)"/>

  <!-- Subtle Perspective Horizon Line at y=75 -->
  <line x1="0" y1="75" x2="1200" y2="75" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- FLOATING CYBER AMBIENT PARTICLES / EMBER SPARKLES -->
  <g>
    <!-- Particle 1 (Cyan) -->
    <circle cx="120" cy="38" r="1.8" fill="#22d3ee" filter="url(#neonBlur)">
      <animate attributeName="cy" values="42;26;42" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Particle 2 (Violet) -->
    <circle cx="280" cy="25" r="2.2" fill="#a78bfa" filter="url(#neonBlur)">
      <animate attributeName="cy" values="32;18;32" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Particle 3 (Emerald) -->
    <circle cx="440" cy="45" r="1.5" fill="#34d399" filter="url(#neonBlur)">
      <animate attributeName="cy" values="48;35;48" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Particle 4 (Cyan) -->
    <circle cx="760" cy="28" r="2" fill="#22d3ee" filter="url(#neonBlur)">
      <animate attributeName="cy" values="35;20;35" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Particle 5 (Violet) -->
    <circle cx="920" cy="40" r="1.8" fill="#c084fc" filter="url(#neonBlur)">
      <animate attributeName="cy" values="45;30;45" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.85;0.25" dur="5.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Particle 6 (Emerald) -->
    <circle cx="1080" cy="30" r="2.2" fill="#34d399" filter="url(#neonBlur)">
      <animate attributeName="cy" values="36;22;36" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============================================================ -->
  <!-- MULTI-LAYER ORGANIC ANIMATED CYBER WAVES                     -->
  <!-- ============================================================ -->

  <!-- WAVE 1: Atmospheric Deep Violet/Pink Wave (Slowest, 8s dur) -->
  <path fill="url(#waveGradViolet)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,88 C150,68 300,108 450,88 C600,68 750,108 900,88 C1050,68 1150,98 1200,88 L1200,140 L0,140 Z;
              M0,98 C150,118 300,78 450,102 C600,118 750,78 900,102 C1050,118 1150,88 1200,98 L1200,140 L0,140 Z;
              M0,82 C150,92 300,112 450,82 C600,92 750,112 900,82 C1050,92 1150,105 1200,85 L1200,140 L0,140 Z;
              M0,88 C150,68 300,108 450,88 C600,68 750,108 900,88 C1050,68 1150,98 1200,88 L1200,140 L0,140 Z"/>
  </path>

  <!-- WAVE 2: Cyber Emerald/Teal Harmonic Wave (10s dur) -->
  <path fill="url(#waveGradEmerald)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,95 C180,72 360,115 540,92 C720,70 900,115 1080,90 C1140,82 1180,95 1200,92 L1200,140 L0,140 Z;
              M0,88 C180,112 360,75 540,108 C720,115 900,75 1080,105 C1140,112 1180,85 1200,90 L1200,140 L0,140 Z;
              M0,102 C180,85 360,110 540,85 C720,95 900,110 1080,85 C1140,92 1180,105 1200,98 L1200,140 L0,140 Z;
              M0,95 C180,72 360,115 540,92 C720,70 900,115 1080,90 C1140,82 1180,95 1200,92 L1200,140 L0,140 Z"/>
  </path>

  <!-- Secondary Laser Crest Line (tracing wave 2) -->
  <path fill="none" stroke="url(#laserCrest2)" stroke-width="1.4" opacity="0.75" filter="url(#laserGlow)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,95 C180,72 360,115 540,92 C720,70 900,115 1080,90 C1140,82 1180,95 1200,92;
              M0,88 C180,112 360,75 540,108 C720,115 900,75 1080,105 C1140,112 1180,85 1200,90;
              M0,102 C180,85 360,110 540,85 C720,95 900,110 1080,85 C1140,92 1180,105 1200,98;
              M0,95 C180,72 360,115 540,92 C720,70 900,115 1080,90 C1140,82 1180,95 1200,92"/>
  </path>

  <!-- WAVE 3: Electric Neon Cyan Foreground Wave (Fastest, 6s dur) -->
  <path fill="url(#waveGradCyan)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,102 C160,78 320,122 480,98 C640,75 800,120 960,95 C1080,82 1160,110 1200,100 L1200,140 L0,140 Z;
              M0,92 C160,118 320,82 480,112 C640,122 800,82 960,110 C1080,118 1160,88 1200,95 L1200,140 L0,140 Z;
              M0,108 C160,88 320,115 480,92 C640,102 800,118 960,90 C1080,95 1160,115 1200,105 L1200,140 L0,140 Z;
              M0,102 C160,78 320,122 480,98 C640,75 800,120 960,95 C1080,82 1160,110 1200,100 L1200,140 L0,140 Z"/>
  </path>

  <!-- Primary Glowing Neon Laser Crest Line (Tracing wave 3) -->
  <path fill="none" stroke="url(#laserCrest)" stroke-width="2.4" filter="url(#neonBlur)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,102 C160,78 320,122 480,98 C640,75 800,120 960,95 C1080,82 1160,110 1200,100;
              M0,92 C160,118 320,82 480,112 C640,122 800,82 960,110 C1080,118 1160,88 1200,95;
              M0,108 C160,88 320,115 480,92 C640,102 800,118 960,90 C1080,95 1160,115 1200,105;
              M0,102 C160,78 320,122 480,98 C640,75 800,120 960,95 C1080,82 1160,110 1200,100"/>
  </path>

  <!-- Subtle Bottom Depth Fade -->
  <rect x="0" y="125" width="1200" height="15" fill="#070b14" opacity="0.65"/>

  <!-- ============================================================ -->
  <!-- FLOATING MINIMALIST CYBER BADGE & MOTTO (ELEGANT & CLEAN)    -->
  <!-- ============================================================ -->

  <g>
    <!-- Glassmorphic Pill Frame with Cyber Glow Border -->
    <rect x="330" y="16" width="540" height="36" rx="18" fill="#070b14" fill-opacity="0.85" stroke="url(#pillBorderGrad)" stroke-width="1.4"/>

    <!-- Left Sparkle -->
    <text x="355" y="39" font-family="'JetBrains Mono', monospace" font-size="14" fill="#22d3ee" font-weight="900">✦</text>

    <!-- Main Title -->
    <text x="600" y="39" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13.5" font-weight="900" fill="url(#brandTitleGrad)" letter-spacing="2.5">DHRUVIL DATTANI  //  FROM THOUGHT TO THING</text>

    <!-- Right Sparkle -->
    <text x="845" y="39" font-family="'JetBrains Mono', monospace" font-size="14" fill="#34d399" font-weight="900">✦</text>

    <!-- Secondary Minimal Subtitle (Resting cleanly above waves) -->
    <text x="600" y="68" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="2">REAL SYSTEMS · REAL IMPACT  //  IDEAS. BUILT DIFFERENT.</text>
  </g>
</svg>
