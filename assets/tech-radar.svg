<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Tech radar: Strong (React, Node, JS, TypeScript, Python), Learning (FastAPI, YOLOv8, TensorFlow, Groq, Gemini), Exploring (Docker, Kubernetes, AWS, GraphQL)">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#22d3ee" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="220" fill="url(#bg)" rx="12" stroke="#1a2340" stroke-width="1"/>
  <text x="400" y="24" text-anchor="middle" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="3" filter="url(#glow)">TECH RADAR</text>

  <!-- Radar rings centered at (210, 120) -->
  <circle cx="210" cy="120" r="90" fill="none" stroke="#1a2340" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="210" cy="120" r="60" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <circle cx="210" cy="120" r="30" fill="#0d1a30" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
  <circle cx="210" cy="120" r="30" fill="none" stroke="#22d3ee" stroke-width="1.5" filter="url(#cyanGlow)"/>
  <line x1="210" y1="24" x2="210" y2="216" stroke="#1a2340" stroke-width="0.8" opacity="0.5"/>
  <line x1="114" y1="120" x2="306" y2="120" stroke="#1a2340" stroke-width="0.8" opacity="0.5"/>

  <!-- Ring labels -->
  <text x="302" y="34" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="8" filter="url(#glow)">● STRONG</text>
  <text x="302" y="50" fill="#8b5cf6" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="8">● LEARNING</text>
  <text x="302" y="66" fill="#3a5070" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="8">● EXPLORING</text>

  <!-- STRONG (inner ring) — React, Node.js, JS, TypeScript, Python, MongoDB -->
  <circle cx="210" cy="94" r="4" fill="#22d3ee" filter="url(#glow)"/>
  <text x="214" y="90" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">React</text>
  <circle cx="232" cy="110" r="4" fill="#22d3ee" filter="url(#glow)"/>
  <text x="236" y="106" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">Node.js</text>
  <circle cx="190" cy="106" r="4" fill="#22d3ee" filter="url(#glow)"/>
  <text x="148" y="102" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">JavaScript</text>
  <circle cx="212" cy="142" r="4" fill="#22d3ee" filter="url(#glow)"/>
  <text x="216" y="138" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">TypeScript</text>
  <circle cx="192" cy="128" r="3.5" fill="#22d3ee" filter="url(#glow)"/>
  <text x="156" y="124" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">Python</text>

  <!-- LEARNING (middle ring) — FastAPI, YOLOv8, TensorFlow, Groq LLM, Gemini API, MongoDB -->
  <circle cx="210" cy="62" r="4" fill="#8b5cf6"/>
  <text x="214" y="58" fill="#8b5cf6" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">FastAPI</text>
  <circle cx="260" cy="82" r="4" fill="#8b5cf6"/>
  <text x="264" y="78" fill="#8b5cf6" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">YOLOv8</text>
  <circle cx="268" cy="140" r="4" fill="#8b5cf6"/>
  <text x="272" y="136" fill="#8b5cf6" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">TensorFlow</text>
  <circle cx="160" cy="148" r="4" fill="#8b5cf6"/>
  <text x="114" y="144" fill="#8b5cf6" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">Groq LLM</text>
  <circle cx="158" cy="84" r="4" fill="#8b5cf6"/>
  <text x="114" y="80" fill="#8b5cf6" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">Gemini API</text>
  <circle cx="264" cy="112" r="4" fill="#8b5cf6"/>
  <text x="268" y="108" fill="#8b5cf6" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">MongoDB</text>

  <!-- EXPLORING (outer ring) — Docker, Kubernetes, AWS, GraphQL -->
  <circle cx="210" cy="32" r="4" fill="#3a5070"/>
  <text x="214" y="28" fill="#7d8590" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">Docker</text>
  <circle cx="288" cy="70" r="4" fill="#3a5070"/>
  <text x="292" y="66" fill="#7d8590" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">Kubernetes</text>
  <circle cx="300" cy="130" r="4" fill="#3a5070"/>
  <text x="304" y="126" fill="#7d8590" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">AWS Cloud</text>
  <circle cx="128" cy="156" r="4" fill="#3a5070"/>
  <text x="88" y="152" fill="#7d8590" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">GraphQL</text>
  <circle cx="126" cy="78" r="4" fill="#3a5070"/>
  <text x="84" y="74" fill="#7d8590" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7.5">Next.js</text>

  <!-- Right: Commit heat chart -->
  <text x="360" y="44" fill="#22d3ee" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="2">COMMIT HEAT BY HOUR</text>
  <text x="360" y="58" fill="#7d8590" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="8">when does Dhruvil ship? 🌙</text>

  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="7" fill="#3a5070">
    <text x="364" y="170">0</text><text x="390" y="170">4</text><text x="416" y="170">8</text>
    <text x="442" y="170">12</text><text x="470" y="170">16</text><text x="496" y="170">20</text>
    <text x="522" y="170">24</text>
  </g>

  <!-- Bar heights for 24 hours (IST adjusted) -->
  <g transform="translate(364, 160)">
    <rect x="0" y="-55" width="7" height="55" rx="2" fill="#8b5cf6" opacity="0.65"/>
    <rect x="9" y="-72" width="7" height="72" rx="2" fill="#8b5cf6" opacity="0.80"/>
    <rect x="18" y="-82" width="7" height="82" rx="2" fill="#8b5cf6" opacity="0.90"/>
    <rect x="27" y="-75" width="7" height="75" rx="2" fill="#8b5cf6" opacity="0.85"/>
    <rect x="36" y="-48" width="7" height="48" rx="2" fill="#8b5cf6" opacity="0.60"/>
    <rect x="45" y="-18" width="7" height="18" rx="2" fill="#22d3ee" opacity="0.35"/>
    <rect x="54" y="-12" width="7" height="12" rx="2" fill="#22d3ee" opacity="0.28"/>
    <rect x="63" y="-10" width="7" height="10" rx="2" fill="#22d3ee" opacity="0.25"/>
    <rect x="72" y="-22" width="7" height="22" rx="2" fill="#22d3ee" opacity="0.40"/>
    <rect x="81" y="-32" width="7" height="32" rx="2" fill="#22d3ee" opacity="0.50"/>
    <rect x="90" y="-40" width="7" height="40" rx="2" fill="#22d3ee" opacity="0.58"/>
    <rect x="99" y="-45" width="7" height="45" rx="2" fill="#22d3ee" opacity="0.62"/>
    <rect x="108" y="-38" width="7" height="38" rx="2" fill="#22d3ee" opacity="0.55"/>
    <rect x="117" y="-36" width="7" height="36" rx="2" fill="#22d3ee" opacity="0.53"/>
    <rect x="126" y="-40" width="7" height="40" rx="2" fill="#22d3ee" opacity="0.58"/>
    <rect x="135" y="-44" width="7" height="44" rx="2" fill="#22d3ee" opacity="0.62"/>
    <rect x="144" y="-50" width="7" height="50" rx="2" fill="#22d3ee" opacity="0.68"/>
    <rect x="153" y="-55" width="7" height="55" rx="2" fill="#22d3ee" opacity="0.72"/>
    <rect x="162" y="-62" width="7" height="62" rx="2" fill="#8b5cf6" opacity="0.78"/>
    <rect x="171" y="-70" width="7" height="70" rx="2" fill="#8b5cf6" opacity="0.84"/>
    <rect x="180" y="-78" width="7" height="78" rx="2" fill="#8b5cf6" opacity="0.88"/>
    <rect x="189" y="-85" width="7" height="85" rx="2" fill="#8b5cf6" opacity="0.95"/>
    <rect x="198" y="-76" width="7" height="76" rx="2" fill="#8b5cf6" opacity="0.86"/>
    <rect x="207" y="-64" width="7" height="64" rx="2" fill="#8b5cf6" opacity="0.75"/>
