name: "🔄 Update Profile Assets"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update-assets:
    name: Refresh Profile SVG Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate profile stats assets
        run: node scripts/generate-assets.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      - name: Commit updated assets as DhruvilTech
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live profile stats [skip ci]"
          commit_user_name: "DhruvilTech"
          commit_user_email: "dhruvildattani9@gmail.com"
          commit_author: "DhruvilTech <dhruvildattani9@gmail.com>"
          file_pattern: "assets/*.svg"
          skip_dirty_check: false
          skip_fetch: false
